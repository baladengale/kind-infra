# The deployable sample Agent on Agent Substrate — references the
# hello-substrate AgentTemplate (behavior) and the sample Harness (runtime).
#
# Applied by scripts/87-kagent-samples.sh (make substrate-samples). Ask it
# where it runs and it will describe its gVisor substrate actor.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: hello-substrate
  namespace: kagent
  labels:
    kagent.dev/sample: kagent
spec:
  harnessRef:
    name: kagent
  template:
    ref:
      name: hello-substrate
