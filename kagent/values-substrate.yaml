# kind-infra kagent values for Agent Substrate mode — layered on top of the
# chart in BOTH deploy modes when SUBSTRATE_ENABLED=true (see scripts/80-kagent.sh).
#
# Schema updated for the kagent checkout past alpha17 (chart keys renamed):
#   controller.substrate.ateApiEndpoint -> config.substrate.apiEndpoint
#   controller.substrate.atenetRouterURL -> config.substrate.routerUrl
#
# The substrate PLATFORM itself (ate-system) is installed separately by
# scripts/85-substrate.sh — this file only wires the kagent controller to it
# and adds the default WorkerPool.
#
# In this mode scripts/80-kagent.sh also switches the chart's `registry` value
# to localhost:PORT and sets substrateWorkerPool.workerImage to the mirrored
# ateom image, so substrate's atelet can rewrite image refs to the in-cluster
# registry Service (see scripts/85-substrate.sh).

config:
  substrate:
    # SHORT name only — the ServiceDNS-issued api-server cert has
    # DNS:api.ate-system.svc as its single SAN, so the FQDN fails hostname
    # verification. Trust comes from controller.substrateClientCertificate
    # (servicedns ClusterTrustBundle), not the public CA.
    apiEndpoint: dns:///api.ate-system.svc:443
    # A2A traffic to Actors is proxied through the substrate atenet router.
    routerUrl: http://atenet-router.ate-system.svc:80
    # Must match Substrate's ateApi.actorJWTIssuer.
    actorJwtIssuer: https://idp.ate-system.svc

controller:
  # The ate-api server serves TLS with a ServiceDNS-issued (SPIFFE) cert;
  # without these rotating credential mounts the controller cannot verify the
  # server and the gRPC dial times out (ssl_verify_result 20).
  substrateClientCertificate:
    enabled: true

# Platform capacity for substrate actors — the WorkerPool runs the ateom
# (gVisor) workers that AgentInstances are scheduled onto. The chart's
# kagent.dev/worker-pool label on this pool is how generated ActorTemplates
# select it. workerImage is versioned and set by scripts/80-kagent.sh to the
# local registry mirror, referenced as localhost:PORT for the atelet rewrite.
substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 2
  sandboxClass: gvisor
