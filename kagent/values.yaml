# kind-infra wrapper defaults for kagent — layered on top of the chart in
# BOTH deploy modes (upstream OCI chart and local ../kagent checkout).
#
# Keep the following off by default for a lean local dev cluster:
#   - cluster-ops agents (spawn extra app pods rarely used locally)
#   - grafana-mcp RemoteMCPServer (requires Grafana, rarely used locally)
#   - standalone agent charts (argo-rollouts, helm, istio)
#
# Agents
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
istio-agent:
  enabled: false

# Cluster-ops agents
cilium-debug-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
observability-agent:
  enabled: false
promql-agent:
  enabled: false

# Remote MCP servers
grafana-mcp:
  enabled: false

# Model provider configuration - DeepSeek via Anthropic-compatible API
providers:
  anthropic:
    # DeepSeek model - using their Claude-compatible API
    model: deepseek-chat
    config:
      # DeepSeek Anthropic-compatible API endpoint
      baseUrl: https://api.deepseek.com/anthropic
