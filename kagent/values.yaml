# kind-infra wrapper defaults for kagent — layered on top of the chart in
# BOTH deploy modes (upstream OCI chart and local ../kagent checkout).
#
# Keep the following off by default for a lean local dev cluster:
#   - cluster-ops agents (spawn extra app pods rarely used locally)
#   - grafana-mcp RemoteMCPServer (requires Grafana, rarely used locally)
#   - standalone agent charts (argo-rollouts, helm, istio)
#
# Agents
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
istio-agent:
  enabled: false

# Cluster-ops agents
cilium-debug-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
observability-agent:
  enabled: false
promql-agent:
  enabled: false

# Remote MCP servers
grafana-mcp:
  enabled: false

# Model provider configuration - DeepSeek via Anthropic-compatible API
providers:
  anthropic:
    # DeepSeek model - using their Claude-compatible API
    model: deepseek-chat
    config:
      # DeepSeek Anthropic-compatible API endpoint
      baseUrl: https://api.deepseek.com/anthropic

# LLM-based session summarization (context compaction): when a session grows,
# older events are summarized by the CHEAP AgentGateway tier (Ark Seed 2.0 Mini
# primary, DeepSeek fallback) instead of the agent's own (pro) model.
# Applied via the agent subcharts' `compaction` values -> Agent CR
# spec.declarative.context.compaction.summarizer.
k8s-agent:
  compaction:
    compactionInterval: 5
    overlapSize: 2
    summarizer:
      modelConfig: agw-cheap-model-config

kgateway-agent:
  compaction:
    compactionInterval: 5
    overlapSize: 2
    summarizer:
      modelConfig: agw-cheap-model-config
