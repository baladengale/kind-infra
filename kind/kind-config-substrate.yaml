# kind cluster config for kagent Agent Substrate (see scripts/85-substrate.sh).
#
# Identical to kind-config.yaml plus the feature gates substrate's pod-identity
# layer requires (ClusterTrustBundle, ClusterTrustBundleProjection,
# PodCertificateRequest) and the certificates.k8s.io/v1beta1 API. These cannot
# be enabled after the cluster is created, so `make substrate-create` uses this
# config instead of the default one.
#
# Keep this file in sync with kind-config.yaml when ports/labels change.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  ClusterTrustBundle: true
  ClusterTrustBundleProjection: true
  PodCertificateRequest: true
runtimeConfig:
  "api/alpha": "false"
  "certificates.k8s.io/v1beta1": "true"
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
networking:
  apiServerAddress: "127.0.0.1"
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 8080
    hostPort: 80
    protocol: TCP
  - containerPort: 8443
    hostPort: 443
    protocol: TCP
