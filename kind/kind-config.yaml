# kind cluster config for local base infra.
#
# - containerd registry config_path enables the local registry wiring done by
#   scripts/10-create-cluster.sh (localhost:5001 -> kind-registry container)
# - the ingress-ready node label is where the AgentGateway proxy pins itself
#   (hostPorts 8080/8443 — see scripts/30-gateway.sh)
# - extraPortMappings publish host 80/443; they map to node ports 8080/8443
#   because the proxy binds unprivileged ports. From the machine everything
#   is plain http://name.internal / https://name.internal
#
# The cluster name is passed via `kind create cluster --name` (see Makefile).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
networking:
  apiServerAddress: "127.0.0.1"
# Substrate WorkerPools project pod identities and trust bundles into the
# ateom workers — k8s 1.35 serves these as certificates.k8s.io/v1beta1, which
# needs the alpha gates on apiserver AND kubelet (kind applies root-level
# featureGates to both) plus the runtimeConfig override. Mirrors
# scripts/kind/kind-config.yaml in the kagent repo.
featureGates:
  ClusterTrustBundle: true
  ClusterTrustBundleProjection: true
  PodCertificateRequest: true
runtimeConfig:
  "api/alpha": "false"
  "certificates.k8s.io/v1beta1": "true"
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 8080
    hostPort: 80
    protocol: TCP
  - containerPort: 8443
    hostPort: 443
    protocol: TCP
