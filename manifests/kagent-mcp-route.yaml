apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
  labels:
    app.kubernetes.io/managed-by: kind-infra
  annotations:
    kind-infra.dev/host: kagent
spec:
  parentRefs:
    - name: kind-infra
      namespace: agentgateway-system
  hostnames:
    - "kagent.${DOMAIN}"
  rules:
    # UI routes (default)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kagent-ui
          port: 8080
    # MCP routes (/mcp path)
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: kagent-controller
          port: 8083