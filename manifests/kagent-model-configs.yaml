# kagent ModelConfigs — all LLM traffic flows through AgentGateway.
#
# Two ModelConfigs (the separate cheap config was folded into the default —
# default IS the cheap tier; DeepSeek stays as the failover inside the gateway
# backends):
#   1. default-model-config — Z.AI glm-5.3-flash via AgentGateway CHEAP tier
#                             (overrides the Helm-provided DeepSeek default).
#                             Every agent uses this one.
#   2. agw-model-config     — via AgentGateway PRO tier: Z.AI glm-5.3 primary
#                             -> DeepSeek fallback. Configured but NOT wired to
#                             any agent — opt in per-agent when pro is wanted.
#
# For LLM-based session summarization, reference default-model-config in the
# agent's context.compaction.summarizer (see kagent/values.yaml).
#
# Applied by scripts/35-agentgateway-llm.sh (which also deletes removed
# configs — ark-model-config, agw-cheap-model-config — and their secrets on
# first run after this change).
---
# Default ModelConfig — overrides the Helm-provided DeepSeek default so every
# agent gets the cheap Z.AI model through the gateway CHEAP tier (DeepSeek
# failover on 429/5xx is handled inside the gateway).
apiVersion: kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: default-model-config
  namespace: kagent
spec:
  provider: Anthropic
  model: glm-5.3-flash
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  anthropic:
    baseUrl: http://kind-infra.agentgateway-system.svc.cluster.local:8080
---
# AgentGateway PRO-tier ModelConfig — requests route through AgentGateway to
# the agw-llm-pro backend (Z.AI glm-5.3 primary, DeepSeek fallback on 429/5xx).
# The API key here is a placeholder for the controller's client; AgentGateway
# injects the real per-backend key. Not referenced by any agent by default.
apiVersion: kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: agw-model-config
  namespace: kagent
spec:
  provider: Anthropic
  model: glm-5.3
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  anthropic:
    baseUrl: http://kind-infra.agentgateway-system.svc.cluster.local:8080
