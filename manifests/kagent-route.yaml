# Consolidated HTTPRoute for kagent — UI and MCP endpoints on one hostname.
# All paths go to the UI except /mcp, which goes to the controller.
# Applied by scripts/80-kagent.sh (`make kagent-deploy`).
#
# Plain YAML — no variables: kubectl apply -f manifests/kagent-route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
  labels:
    app.kubernetes.io/managed-by: kind-infra
  annotations:
    kind-infra.dev/host: kagent
spec:
  parentRefs:
    - name: kind-infra
      namespace: agentgateway-system
  hostnames:
    - kagent.internal
  rules:
    # UI routes (default) - all other paths go to UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kagent-ui
          port: 8080
    # MCP routes - /mcp path goes to controller
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: kagent-controller
          port: 8083
