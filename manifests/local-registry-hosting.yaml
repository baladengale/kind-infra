# Advertise the local registry to tooling that understands the
# local-registry-hosting convention (https://kind.sigs.k8s.io/docs/user/local-registry/).
#
# Plain YAML — no variables: kubectl apply -f manifests/local-registry-hosting.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-registry-hosting
  namespace: kube-public
data:
  localRegistryHosting.v1: |
    host: "localhost:5001"
    hostFromClusterNetwork: "kind-registry:5000"
    help: "https://kind.sigs.k8s.io/docs/user/local-registry/"
