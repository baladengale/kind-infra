# Port-free registry access: https://kind-registry.internal through the
# Gateway on 443 (scripts/50-registry.sh).
#
# Plain YAML — no variables: kubectl apply -f manifests/registry-route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kind-registry
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kind-infra
spec:
  parentRefs:
  - name: kind-infra
    namespace: agentgateway-system
  hostnames:
  - kind-registry.internal
  rules:
  - backendRefs:
    - name: kind-registry
      port: 5000
