# Registry reachable from inside the cluster: a headless Service with manual
# Endpoints pointing at the kind-registry container's IP on the kind network
# (scripts/50-registry.sh fills in ${REG_IP}), so the Gateway can proxy it
# like any other backend.
apiVersion: v1
kind: Service
metadata:
  name: kind-registry
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kind-infra
spec:
  ports:
  - name: registry
    port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kind-registry
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kind-infra
subsets:
- addresses:
  - ip: ${REG_IP}
  ports:
  - name: registry
    port: 5000
