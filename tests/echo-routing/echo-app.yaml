# Tiny echo workload used by the chainsaw e2e tests (tests/echo-routing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kind-infra-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        # Pulled from the local TLS registry — nodes resolve it via the
        # containerd certs.d bypass wired by scripts/50-registry.sh. The
        # image is seeded into the registry by the test's first step.
        image: kind-registry.internal/http-echo:1.0.0
        args: ["-text=kind-infra-e2e", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kind-infra-test
spec:
  selector:
    app: echo
  ports:
  - name: http
    port: 8080
    targetPort: 8080
