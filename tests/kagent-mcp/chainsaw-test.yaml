apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kagent-mcp-gateway
spec:
  description: >-
    End-to-end MCP server validation: HTTPRoute creation, gateway routing,
    MCP endpoint availability, and the AgentInstance tool surface
    (list_agent_instances, invoke_agent_instance). The agent under test is a
    hermetic self-test instance created through the controller's own gRPC
    API, so the test never touches real user instances.
  steps:
    - name: verify-kagent-running
      description: Ensure kagent controller is deployed and ready
      try:
        - script:
            content: |
                kubectl get pods -n kagent -l app.kubernetes.io/component=controller
                kubectl wait --for=condition=Ready pod -n kagent -l app.kubernetes.io/component=controller --timeout=60s
      cleanup:
        - script:
            content: |
                kubectl delete -n kagent agenttemplate mcp-e2e-selftest --ignore-not-found
                if [ -f /tmp/kagent-mcp-test-instance-id ]; then
                  (cd "${REPO_ROOT}/tests/kagent-mcp/mcp-validation/instance-helper" \
                    && go run . delete "$(cat /tmp/kagent-mcp-test-instance-id)") || true
                  rm -f /tmp/kagent-mcp-test-instance-id
                fi

    - name: verify-existing-kagent-route
      description: Verify existing kagent HTTPRoute includes MCP routing
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                namespace: kagent
                name: kagent
              spec:
                rules:
                - backendRefs:
                  - name: kagent-ui
                    port: 8080
                  matches:
                  - path:
                      type: PathPrefix
                      value: /
                - backendRefs:
                  - name: kagent-controller
                    port: 8083
                  matches:
                  - path:
                      type: PathPrefix
                      value: /mcp

    - name: create-test-agent-template
      description: Apply the self-test AgentTemplate and wait for its golden snapshot
      try:
        - apply:
            file: mcp-validation/agent-test.yaml
        - script:
            content: |
                # The Harness compiles the template into an ActorTemplate golden
                # snapshot; the instance gRPC below fails before that lands.
                for _ in $(seq 1 60); do
                  ready="$(kubectl get agenttemplate mcp-e2e-selftest -n kagent -o json 2>/dev/null \
                    | jq -r '[.status.harnesses[]?.conditions[]? | select(.type=="Ready") | .status] | join(",")')"
                  [ "$ready" = "True" ] && exit 0
                  sleep 2
                done
                echo "AgentTemplate mcp-e2e-selftest never became Ready (last: ${ready})"
                exit 1

    - name: create-test-instance
      description: Create a self-test AgentInstance via the controller gRPC API
      try:
        - script:
            content: |
                cd "${REPO_ROOT}/tests/kagent-mcp/mcp-validation/instance-helper"
                go run . create kagent mcp-e2e-selftest | tee /tmp/kagent-mcp-test-instance.json
                id="$(jq -r .id /tmp/kagent-mcp-test-instance.json)"
                [ -n "$id" ] && [ "$id" != "null" ]
                echo "$id" > /tmp/kagent-mcp-test-instance-id

    - name: verify-mcp-endpoint-availability
      description: Test MCP endpoint responds correctly
      try:
        - script:
            content: |
                for _ in $(seq 1 30); do
                  code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                    --cacert "${REPO_ROOT}/certs/rootCA.pem" \
                    "https://kagent.${DOMAIN}/mcp" || true)"
                  [ "$code" = "200" ] || [ "$code" = "405" ] && exit 0
                  sleep 2
                done
                echo "MCP endpoint at https://kagent.${DOMAIN}/mcp not available (last: ${code})"
                exit 1

    - name: test-mcp-tool-surface
      description: Validate the AgentInstance MCP tool surface
      try:
        - script:
            content: |
                # Stateless streamable-HTTP MCP: tools/list over POST/SSE
                response=$(curl -s --cacert "${REPO_ROOT}/certs/rootCA.pem" \
                  -X POST "https://kagent.${DOMAIN}/mcp" \
                  -H "Content-Type: application/json" \
                  -H "Accept: application/json, text/event-stream" \
                  -d '{"jsonrpc":"2.0","method":"tools/list","id":1}')
                printf '%s\n' "$response"
                for tool in list_agent_instances invoke_agent_instance \
                            list_agent_instance_checkpoints create_agent_instance_checkpoint \
                            fork_agent_instance; do
                  if printf '%s\n' "$response" | grep '^data:' | sed 's/^data: //' \
                      | jq -e --arg t "$tool" '.result.tools[]? | select(.name == $t)' > /dev/null; then
                    echo "OK $tool available"
                  else
                    echo "FAIL $tool not found"
                    exit 1
                  fi
                done

    - name: test-list-agent-instances
      description: list_agent_instances discovers the self-test instance
      try:
        - script:
            content: |
                instance_id="$(cat /tmp/kagent-mcp-test-instance-id)"
                response=$(curl -s --cacert "${REPO_ROOT}/certs/rootCA.pem" \
                  -X POST "https://kagent.${DOMAIN}/mcp" \
                  -H "Content-Type: application/json" \
                  -H "Accept: application/json, text/event-stream" \
                  -d '{"jsonrpc":"2.0","method":"tools/call","id":2,"params":{"name":"list_agent_instances","arguments":{}}}')
                echo "list_agent_instances response: $response"
                if printf '%s\n' "$response" | grep '^data:' | sed 's/^data: //' \
                    | jq -e --arg id "$instance_id" \
                      '.result.structuredContent.agent_instances[]? | select(.id == $id and .state == "AGENT_INSTANCE_STATE_READY")' > /dev/null; then
                  echo "OK self-test instance READY and discoverable via MCP"
                else
                  echo "FAIL self-test instance $instance_id not listed"
                  exit 1
                fi

    - name: test-invoke-agent-instance
      description: invoke_agent_instance runs the self-test instance end to end
      try:
        - script:
            content: |
                instance_id="$(cat /tmp/kagent-mcp-test-instance-id)"
                response=$(curl -s --cacert "${REPO_ROOT}/certs/rootCA.pem" --max-time 180 \
                  -X POST "https://kagent.${DOMAIN}/mcp" \
                  -H "Content-Type: application/json" \
                  -H "Accept: application/json, text/event-stream" \
                  -d "{\"jsonrpc\":\"2.0\",\"method\":\"tools/call\",\"id\":3,\"params\":{\"name\":\"invoke_agent_instance\",\"arguments\":{\"agent_instance_id\":\"${instance_id}\",\"message\":\"Say hi\"}}}")
                echo "invoke response: $response"
                # MCP → A2A gateway → atenet router → substrate actor → LLM → task
                printf '%s\n' "$response" | grep '^data:' | sed 's/^data: //' | jq -e '
                  .result.structuredContent
                  | (.state == "TASK_STATE_COMPLETED")
                  and (.text | contains("MCP validation OK"))' > /dev/null
                echo "OK self-test instance completed a turn via MCP"
