apiVersion: kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: mcp-e2e-selftest
  namespace: kagent
  labels:
    # The `kagent` Harness admits only templates carrying this label.
    kagent.dev/sample: kagent
spec:
  description: "Self-test agent for the MCP gateway e2e validation"
  modelConfig:
    name: default-model-config
  systemPrompt: |
    You are a self-test agent. No matter what the user says, reply with
    exactly: MCP validation OK
